corpus_name: mixed_ai_cs_v1
version: "1.0"

description: >
  Controlled corpus combining foundational information-retrieval research
  with openly licensed technical documentation for evaluating dense,
  lexical, hybrid, and reranked retrieval.

categories:
  research:
    - information_retrieval
    - rag
    - semantic_search
    - reranking

  technical:
    - python
    - web_frameworks
    - machine_learning

documents:

